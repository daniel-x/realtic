<!doctype html>
<meta charset="utf-8">

<title>realtic chat</title>

  body { font: 15px system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }

  #peers { color: #555; font-size: 13px; margin: 8px 0; }
