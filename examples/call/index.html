<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>realtic call</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: #222; flex-wrap: wrap; }
  #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; padding: 16px; }
  .tile { background: #000; border-radius: 6px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; }
  .tile video { width: 100%; height: 100%; object-fit: cover; }
  .tile .label { position: absolute; left: 6px; bottom: 6px; background: #0009; padding: 2px 6px; border-radius: 4px; cursor: copy; }
  .state-slow .label { background: #a70; }
  .state-reconnecting .label, .state-unreachable .label { background: #a22; }
  #diag { display: none; white-space: pre; font: 11px monospace; max-height: 40vh; overflow: auto; background: #000; padding: 8px 16px; }
  button { font: inherit; }
</style>
<header>
  <strong>realtic call</strong>
  <span id="me"></span>
  <button id="mute">Mute</button>
  <button id="screen" hidden>Share screen</button>
  <button id="diagBtn">Diagnostics</button>
  <button id="copy">Copy log</button>
</header>
<div id="tiles"></div>
<div id="diag"></div>
<script type="module" src="./call.js"></script>
